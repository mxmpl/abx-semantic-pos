[project]
name = "abx-semantic-pos"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maxime Poli" }, { name = "Robin Algayres" }]
dependencies = [
  "fastabx>=0.7.1",
  "polars>=1.39.3",
]

[project.scripts]
abx-pos = "abx_semantic_pos.cli:pos_cli"
abx-semantic = "abx_semantic_pos.cli:semantic_cli"

[dependency-groups]
dev = [
  "ipykernel>=7.2.0",
  "prek>=0.3.8",
]

[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["CPY", "D", "DOC", "T201"]
