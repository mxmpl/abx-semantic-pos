[project]
name = "abx-semantic-pos"
version = "0.1.0"
description = "Syntactic and semantic ABX"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Maxime Poli" }, { name = "Robin Algayres" }]
dependencies = [
  "fastabx>=0.7.1",
  "polars>=1.39.3",
]

[dependency-groups]
dev = [
  "ipykernel>=7.2.0",
  "prek>=0.3.8",
]

[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = ["CPY", "D203", "D213"]
pylint = { max-args = 6 }
